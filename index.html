<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1366">
<title>Family Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   THEME TOKENS
═══════════════════════════════════════════════════════════════ */
:root {
  --bg: #f0f2f5; --surface: #ffffff; --surface2: #e8eaed;
  --border: rgba(0,0,0,0.1); --text: #1a1c22; --muted: #7a7f90;
  --dim: #9098a8; --blue: #2563eb; --blue-dim: rgba(37,99,235,0.1);
  --coral: #e05c2a; --red: #dc2626; --green: #16a34a;
  /* Calendar-specific */
  --cal-today-bg: rgba(37,99,235,0.05);
  --cal-today-ring: #2563eb;
  --cal-hour-line: rgba(0,0,0,0.055);
  --cal-half-line: rgba(0,0,0,0.03);
  --cal-allday-bg: rgba(0,0,0,0.025);
  --cal-now: #e53935;
  --cal-time-text: #a8afc0;
  --cal-header-sub: #9098a8;
}
html.dark-mode {
  --bg: #0c0e14; --surface: #13161f; --surface2: #1a1e2a;
  --border: rgba(255,255,255,0.07); --text: #e2e5f0; --muted: #565c72;
  --dim: #363c50; --blue: #4f8ef7; --blue-dim: rgba(79,142,247,0.12);
  --coral: #f5875a; --red: #f06060; --green: #5dca7a;
  --cal-today-bg: rgba(79,142,247,0.07);
  --cal-today-ring: #4f8ef7;
  --cal-hour-line: rgba(255,255,255,0.05);
  --cal-half-line: rgba(255,255,255,0.025);
  --cal-allday-bg: rgba(255,255,255,0.025);
  --cal-now: #ef5350;
  --cal-time-text: #3d4458;
  --cal-header-sub: #565c72;
}
html.dark-mode .clock,
html.dark-mode .clock-sub { color: #e2e5f0; }

/* ═══════════════════════════════════════════════════════════════
   SCREENSAVER
═══════════════════════════════════════════════════════════════ */
#screensaver {
  display:none; position:fixed; inset:0; background:#000; z-index:999;
  align-items:center; justify-content:center; flex-direction:column; gap:8px; cursor:pointer;
}
#screensaver.active { display:flex; }
#ss-clock { font-family:'DM Mono',monospace; font-size:12vw; font-weight:300; color:rgba(255,255,255,0.15); letter-spacing:-4px; line-height:1; }
#ss-date  { font-family:'DM Mono',monospace; font-size:2vw; color:rgba(255,255,255,0.08); }

/* ═══════════════════════════════════════════════════════════════
   BASE LAYOUT
═══════════════════════════════════════════════════════════════ */
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:100%; height:100%; overflow:hidden; }
body { background:var(--bg); font-family:'DM Sans',sans-serif; color:var(--text); font-size:14px; line-height:1.4; }

.screen { width:100vw; height:100vh; display:grid; grid-template-rows:auto 1fr; padding:0.7vw 1.4vw 0.6vw; gap:0.5vh; }
.topbar { display:grid; grid-template-columns:1fr auto; align-items:center; }
.clock-block { display:flex; align-items:baseline; gap:0.8vw; }
.clock     { font-family:'DM Mono',monospace; font-size:1.3vw; font-weight:400; color:#1a1c22; letter-spacing:-1px; line-height:1; }
.clock-sub { font-family:'DM Mono',monospace; font-size:1.3vw; font-weight:400; color:#1a1c22; letter-spacing:-1px; line-height:1; }
.topbar-right { display:flex; align-items:center; gap:6px; }
.refresh-btn { background:var(--surface2); border:0.5px solid var(--border); border-radius:6px; color:var(--muted); font-size:0.72vw; padding:0.2vw 0.6vw; cursor:pointer; font-family:'DM Sans',sans-serif; transition:color 0.2s; }
.refresh-btn:hover { color:var(--text); }

.main { display:grid; grid-template-columns:minmax(0,1fr) 22.5vw; gap:0.8vw; min-height:0; min-width:0; }
.col  { display:flex; flex-direction:column; gap:0.8vw; min-height:0; min-width:0; }
.card { background:var(--surface); border:0.5px solid var(--border); border-radius:0.8vw; padding:0.9vw 1vw; overflow:hidden; }
.card-title { font-size:0.8vw; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:0.7vw; }

/* ═══════════════════════════════════════════════════════════════
   NATIVE CALENDAR
═══════════════════════════════════════════════════════════════ */
#cal-root {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 0.8vw;
  display: flex;
  flex-direction: column;
  min-height: 0;
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* Header row */
#cal-header {
  display: grid;
  grid-template-columns: 42px repeat(7, 1fr);
  flex-shrink: 0;
  border-bottom: 0.5px solid var(--border);
  background: var(--surface);
  z-index: 10;
}
.cal-header-gutter { /* spacer */ }
.cal-day-header {
  padding: 5px 5px 4px;
  text-align: center;
  border-left: 0.5px solid var(--border);
}
.cal-day-header.today { background: var(--cal-today-bg); }
.cal-day-header-dow {
  font-size: 0.72vw; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--cal-header-sub); line-height: 1;
}
.cal-day-header.today .cal-day-header-dow { color: var(--cal-today-ring); }
.cal-day-header-date {
  font-family: 'DM Mono', monospace;
  font-size: 0.92vw; font-weight: 400; color: var(--text);
  line-height: 1.1; margin-top: 2px; display: inline-block;
}
.cal-day-header.today .cal-day-header-date {
  background: var(--cal-today-ring);
  color: #fff;
  border-radius: 4px;
  padding: 1px 5px;
  font-weight: 500;
}

/* All-day strip */
#cal-allday {
  display: grid;
  grid-template-columns: 42px repeat(7, 1fr);
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: var(--cal-allday-bg);
}
.cal-allday-label {
  font-size: 0.55vw; color: var(--cal-time-text);
  letter-spacing: 0.08em; text-transform: uppercase;
  display: flex; align-items: flex-start; justify-content: flex-end;
  padding: 5px 5px 4px 0; padding-top: 6px; flex-shrink: 0;
  font-family: 'DM Mono', monospace;
}
.cal-allday-col {
  border-left: 0.5px solid var(--border);
  padding: 2px 2px 2px;
  min-height: 24px;
  max-height: 50px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.cal-allday-col.today { background: var(--cal-today-bg); }
.cal-allday-event {
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 0.78vw;
  font-weight: 500;
  line-height: 1.35;
  color: #fff;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  cursor: default;
  flex-shrink: 0;
}
.cal-allday-more {
  font-size: 0.58vw;
  color: var(--muted);
  padding: 0 4px;
  flex-shrink: 0;
}

/* Scrollable time grid */
#cal-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
}
#cal-scroll::-webkit-scrollbar { width: 4px; }
#cal-scroll::-webkit-scrollbar-track { background: transparent; }
#cal-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

#cal-grid {
  display: grid;
  grid-template-columns: 42px repeat(7, 1fr);
  position: relative;
}

/* Hour labels */
.cal-hour-label {
  grid-column: 1;
  height: 48px;
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  padding: 0 5px 0 0;
  padding-top: 3px;
  font-family: 'DM Mono', monospace;
  font-size: 0.58vw;
  color: var(--cal-time-text);
  letter-spacing: 0.03em;
  position: relative;
  z-index: 1;
  user-select: none;
}

/* Day columns */
.cal-day-col {
  position: relative;
  border-left: 0.5px solid var(--border);
  grid-row: 1 / 25;
}
.cal-day-col.today { background: var(--cal-today-bg); }

/* Hour cells — only for grid lines */
.cal-hour-cell {
  height: 48px;
  border-top: 0.5px solid var(--cal-hour-line);
  position: relative;
}
.cal-hour-cell:first-child { border-top: none; }
.cal-hour-cell::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  top: 50%;
  border-top: 0.5px dashed var(--cal-half-line);
  pointer-events: none;
}

/* Events */
.cal-event {
  position: absolute;
  left: 2px; right: 2px;
  border-radius: 4px;
  padding: 2px 5px;
  font-size: 0.82vw;
  line-height: 1.35;
  color: #fff;
  overflow: hidden;
  cursor: default;
  z-index: 2;
  border-left-width: 3px;
  border-left-style: solid;
}
.cal-event-time {
  font-family: 'DM Mono', monospace;
  font-size: 0.76vw;
  opacity: 0.82;
  white-space: nowrap;
  flex-shrink: 0;
}
.cal-event-inner {
  display: flex;
  flex-wrap: wrap;
  gap: 0 4px;
  overflow: hidden;
}
.cal-event-title {
  font-weight: 500;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  flex: 1;
  min-width: 0;
}

/* Now indicator */
#now-line-wrap {
  position: absolute;
  top: 0; bottom: 0;
  pointer-events: none;
  z-index: 5;
}
#now-line {
  position: absolute;
  left: -1px; right: 0;
  height: 2px;
  background: var(--cal-now);
}
#now-dot {
  position: absolute;
  left: -4px;
  top: 50%;
  transform: translateY(-50%);
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--cal-now);
}

/* Calendar loading/error overlays */
#cal-loading {
  position: absolute; inset: 0;
  display: none;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 8px;
  font-size: 0.75vw; color: var(--muted);
  background: var(--surface);
  z-index: 20;
}
.cal-spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: calspin 0.8s linear infinite;
}
@keyframes calspin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════════════════════════════
   WEATHER WIDGET
═══════════════════════════════════════════════════════════════ */
.wx-card {
  flex:1; border-radius:0.8vw; overflow:hidden; position:relative;
  display:flex; flex-direction:column; min-height:0;
  border:0.5px solid rgba(255,255,255,0.18);
  background:linear-gradient(160deg,#1a3a5c 0%,#1e4a7a 35%,#2a5fa0 65%,#1b3a62 100%);
  box-shadow:0 4px 24px rgba(0,0,0,0.18);
}
.wx-card::before {
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse 120% 60% at 80% 20%,rgba(255,255,255,0.07) 0%,transparent 60%),
             radial-gradient(ellipse 80% 40% at 10% 80%,rgba(100,160,255,0.08) 0%,transparent 50%);
  pointer-events:none; z-index:0;
}
.wx-inner { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; padding:10px 12px 8px; min-height:0; }
.wx-location-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
.wx-location { font-size:0.92vw; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.7); display:flex; align-items:center; gap:4px; }
.wx-updated { font-size:0.78vw; color:rgba(255,255,255,0.35); font-family:'DM Mono',monospace; }
.wx-main-row { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:2px; }
.wx-temp-block { display:flex; flex-direction:column; }
.wx-temp { font-size:4.2vw; font-weight:300; color:#fff; letter-spacing:-2px; line-height:1; margin-bottom:1px; }
.wx-temp sup { font-size:1.4vw; font-weight:400; letter-spacing:0; vertical-align:super; margin-left:1px; }
.wx-condition { font-size:1.0vw; color:rgba(255,255,255,0.85); font-weight:400; margin-top:2px; }
.wx-feels { font-size:0.88vw; color:rgba(255,255,255,0.5); margin-top:2px; }
.wx-icon-wrap { display:flex; align-items:center; justify-content:center; width:3vw; height:3vw; flex-shrink:0; }
.wx-details-row { display:flex; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
.wx-detail-pill { display:flex; align-items:center; gap:3px; background:rgba(255,255,255,0.1); border-radius:20px; padding:3px 9px; font-size:0.82vw; color:rgba(255,255,255,0.8); }
.wx-divider-row { display:flex; align-items:center; margin-bottom:6px; flex-shrink:0; }
.wx-divider { height:0.5px; background:rgba(255,255,255,0.15); flex-shrink:0; }
.wx-forecast { display:flex; gap:4px; flex:1; min-height:0; }
.wx-day { flex:1; background:rgba(255,255,255,0.07); border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:5px 4px; gap:2px; border:0.5px solid rgba(255,255,255,0.1); }
.wx-day-name { font-size:0.8vw; font-weight:500; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.6); }
.wx-day-icon { width:1.9vw; height:1.9vw; display:flex; align-items:center; justify-content:center; }
.wx-day-hi { font-size:1.05vw; font-weight:500; color:#fff; line-height:1; }
.wx-day-lo { font-size:0.88vw; color:rgba(255,255,255,0.45); line-height:1; }
.wx-precip { display:flex; align-items:center; gap:3px; font-size:0.76vw; color:rgba(130,200,255,0.85); }
.wx-loading { flex:1; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.4); font-size:0.75vw; gap:8px; }
.wx-spinner { width:14px; height:14px; border:2px solid rgba(255,255,255,0.15); border-top-color:rgba(255,255,255,0.6); border-radius:50%; animation:wxspin 0.8s linear infinite; }
@keyframes wxspin { to { transform:rotate(360deg); } }
html.dark-mode .wx-card { background:linear-gradient(160deg,#0f2540 0%,#143560 35%,#1c4a80 65%,#0e2440 100%); }

/* ═══════════════════════════════════════════════════════════════
   SCORES
═══════════════════════════════════════════════════════════════ */
.score-loading { font-size:14px; color:var(--muted); text-align:center; padding:10px 0; }
.score-card { border-radius:10px; overflow:hidden; }
.score-card.mlb { background:#fef2f2; border:0.5px solid rgba(189,48,57,0.25); }
.score-card.mlb .sc-header { background:#bd3039; padding:6px 12px; display:flex; justify-content:space-between; align-items:center; }
.score-card.mlb .sc-league-label { font-size:15px; font-weight:700; color:#fff; }
.score-card.mlb .sc-status { font-size:12px; color:rgba(255,255,255,0.85); font-family:'DM Mono',monospace; }
.score-card.mlb .sc-body { padding:4px 0; }
.score-card.mlb .sc-team { display:flex; justify-content:space-between; align-items:center; padding:5px 12px; border-bottom:0.5px solid rgba(0,0,0,0.07); }
.score-card.mlb .sc-team:last-of-type { border-bottom:none; }
.score-card.mlb .sc-abbr { font-size:15px; font-weight:500; color:#111; }
.score-card.mlb .sc-score { font-family:'DM Mono',monospace; font-size:26px; font-weight:500; color:#aaa; }
.score-card.mlb .sc-score.winner { color:#bd3039; }
html.dark-mode .score-card.mlb { background:#1a0d0d; border-color:rgba(189,48,57,0.3); }
html.dark-mode .score-card.mlb .sc-abbr { color:#e8d8d8; }
html.dark-mode .score-card.mlb .sc-score { color:#664444; }
html.dark-mode .score-card.mlb .sc-score.winner { color:#e06060; }
.sc-series { padding:3px 12px; font-size:11px; font-weight:500; text-align:center; color:#fff; letter-spacing:0.03em; }

/* Linescore */
.sc-linescore { margin:4px 12px 6px; overflow-x:auto; }
.sc-linescore table { width:100%; border-collapse:collapse; font-family:'DM Mono',monospace; font-size:11px; }
.sc-linescore th { color:var(--muted); font-weight:400; text-align:center; padding:2px 4px; min-width:18px; border-bottom:0.5px solid var(--border); }
.sc-linescore th.sc-ls-team { text-align:left; min-width:36px; padding-left:0; }
.sc-linescore td { text-align:center; padding:3px 4px; color:var(--text); }
.sc-linescore td.sc-ls-team { text-align:left; font-family:'DM Sans',sans-serif; font-size:11px; font-weight:500; color:var(--muted); padding-left:0; }
.sc-linescore td.sc-ls-cur { background:var(--blue-dim); color:var(--blue); font-weight:500; border-radius:3px; }
.sc-linescore td.sc-ls-total { font-weight:600; color:var(--text); border-left:0.5px solid var(--border); }
.sc-linescore td.sc-ls-winner { color:#bd3039; }
html.dark-mode .sc-linescore td.sc-ls-winner { color:#e06060; }

/* Probable pitchers */
.sc-probables { margin:0 12px 4px; padding:6px 0 2px; border-top:0.5px solid var(--border); }
.sc-probables-label { font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
.sc-probable-row { display:flex; align-items:center; gap:6px; font-size:11px; padding:3px 0; border-bottom:0.5px solid var(--border); }
.sc-probable-row:last-child { border-bottom:none; }
.sc-probable-team { font-size:10px; font-weight:700; color:var(--muted); background:var(--surface2); padding:1px 5px; border-radius:3px; flex-shrink:0; min-width:30px; text-align:center; font-family:'DM Mono',monospace; }
.sc-probable-name { color:var(--text); font-weight:500; flex:1; }
.sc-probable-stat { color:var(--dim); font-family:'DM Mono',monospace; font-size:10px; }
.sc-probable-record { color:var(--muted); font-family:'DM Mono',monospace; font-size:10px; }

/* Live situation */
.sc-live { margin:0 12px 6px; padding:6px 0 4px; border-top:0.5px solid var(--border); }
.sc-inning-label { font-size:11px; font-weight:600; color:var(--text); }

/* Decisions */
.sc-decisions { margin:4px 12px 4px; border-top:0.5px solid var(--border); padding-top:5px; }

/* NFL card (Patriots) — primary navy #002a5c */
.score-card.nfl { background:#eef2f8; border:0.5px solid rgba(0,42,92,0.22); }
.score-card.nfl .sc-header { background:#002a5c; padding:6px 12px; display:flex; justify-content:space-between; align-items:center; }
.score-card.nfl .sc-league-label { font-size:15px; font-weight:700; color:#fff; }
.score-card.nfl .sc-status { font-size:12px; color:rgba(255,255,255,0.88); font-family:'DM Mono',monospace; }
.score-card.nfl .sc-body { padding:4px 0; }
.score-card.nfl .sc-team { display:flex; justify-content:space-between; align-items:center; padding:5px 12px; border-bottom:0.5px solid rgba(0,0,0,0.07); }
.score-card.nfl .sc-team:last-of-type { border-bottom:none; }
.score-card.nfl .sc-team.has-ball { background:rgba(0,42,92,0.07); }
.score-card.nfl .sc-abbr { font-size:15px; font-weight:500; color:#111; display:flex; align-items:center; gap:6px; }
.score-card.nfl .sc-score { font-family:'DM Mono',monospace; font-size:26px; font-weight:500; color:#aaa; }
.score-card.nfl .sc-score.winner { color:#002a5c; }
html.dark-mode .score-card.nfl { background:#0a1526; border-color:rgba(70,120,190,0.3); }
html.dark-mode .score-card.nfl .sc-abbr { color:#d6e2f2; }
html.dark-mode .score-card.nfl .sc-score { color:#4a5a70; }
html.dark-mode .score-card.nfl .sc-score.winner { color:#7ba7e0; }
html.dark-mode .score-card.nfl .sc-team.has-ball { background:rgba(90,140,210,0.13); }
/* NFL upcoming info rows + live situation bar */
.sc-nfl-info { margin:2px 12px 8px; display:flex; flex-direction:column; gap:6px; padding-top:7px; }
.sc-nfl-row { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text); line-height:1.3; }
.sc-nfl-row svg { flex-shrink:0; color:var(--muted); }
.sc-nfl-row .sub { color:var(--muted); font-size:11px; }
.sc-nfl-situation { margin:2px 12px 8px; padding:6px 10px; background:rgba(0,42,92,0.07); border-radius:8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
html.dark-mode .sc-nfl-situation { background:rgba(90,140,210,0.13); }
.sc-nfl-dd { font-size:12px; font-weight:600; color:var(--text); }
.sc-nfl-poss { font-size:11px; color:var(--muted); font-family:'DM Mono',monospace; display:flex; align-items:center; gap:5px; }

/* Carousel */
.carousel-dot { width:6px; height:6px; border-radius:50%; background:var(--surface2); border:0.5px solid var(--border); cursor:pointer; transition:background 0.2s; flex-shrink:0; }
.carousel-dot.active { background:var(--muted); }

/* ═══════════════════════════════════════════════════════════════
   CONFIG MODAL
═══════════════════════════════════════════════════════════════ */
.cfg-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; }
.cfg-overlay.open { display:flex; }
.cfg-modal { background:var(--surface); border:0.5px solid rgba(0,0,0,0.15); border-radius:14px; padding:24px; width:520px; max-height:88vh; overflow-y:auto; }
.cfg-title { font-size:18px; font-weight:500; color:var(--text); margin-bottom:18px; }
.cfg-section { margin-bottom:16px; }
.cfg-label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; font-weight:500; }
.cfg-input { width:100%; padding:8px 12px; background:var(--surface2); border:0.5px solid var(--border); border-radius:7px; color:var(--text); font-family:'DM Mono',monospace; font-size:12px; outline:none; }
.cfg-input:focus { border-color:var(--blue); }
.cfg-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
.cfg-btn { background:var(--surface2); border:0.5px solid var(--border); border-radius:7px; color:var(--text); font-size:14px; font-family:'DM Sans',sans-serif; padding:8px 16px; cursor:pointer; }
.cfg-btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
.cfg-note { font-size:11px; color:var(--muted); margin-top:6px; line-height:1.5; }

.spinner { width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }

<body>

<!-- ═══ SCREENSAVER ═══════════════════════════════════════════════════════ -->
<div id="screensaver" onclick="exitScreensaver()">
  <div id="ss-clock">--:-- --</div>
  <div id="ss-date"></div>
</div>

<!-- ═══ MAIN SCREEN ══════════════════════════════════════════════════════ -->
<div class="screen">
  <div class="topbar">
    <div class="clock-block">
      <div class="clock" id="clock">--:-- --</div>
      <div class="clock-sub" id="datestr">Loading...</div>
    </div>
    <div class="topbar-right">
      <button class="refresh-btn" onclick="refreshAll()">&#8635; Refresh</button>
      <button class="refresh-btn" onclick="openConfig()">&#9881; Setup</button>

  </div>

  <div class="main">

    <!-- ── NATIVE CALENDAR ─────────────────────────────────────────────── -->

    <!-- ── RIGHT COLUMN ────────────────────────────────────────────────── -->

      <div class="wx-card">
        <div class="wx-inner" id="wx-inner">
          <div class="wx-loading"><div class="wx-spinner"></div><span>Loading weather…</span></div>
        </div>
      </div>

      <!-- Scores carousel -->
      <div class="card" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-shrink:0;">
          <div style="display:flex;align-items:center;gap:5px;">
            <div id="carousel-dots" style="display:flex;gap:4px;align-items:center;"></div>
            <button onclick="carouselPrev()" style="background:var(--surface2);border:0.5px solid var(--border);border-radius:5px;color:var(--muted);width:22px;height:22px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;">&#8249;</button>
            <button onclick="carouselNext()" style="background:var(--surface2);border:0.5px solid var(--border);border-radius:5px;color:var(--muted);width:22px;height:22px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;">&#8250;</button>
          </div>

</div>

<!-- ═══ CONFIG MODAL ══════════════════════════════════════════════════════ -->
<div class="cfg-overlay" id="cfg-overlay">
  <div class="cfg-modal">
    <div class="cfg-title">Dashboard Setup</div>

    <!-- Display mode -->
    <div class="cfg-section">
      <div class="cfg-label">Display Override</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
        <button class="cfg-btn" id="override-light-btn" onclick="overrideMode('light')">&#9728; Light</button>
        <button class="cfg-btn" id="override-dark-btn"  onclick="overrideMode('dark')">&#9790; Dark</button>
        <button class="cfg-btn" onclick="overrideMode('screensaver')">&#128164; Screensaver</button>
      </div>
    </div>

    <!-- Google Calendar API Key -->
    <div class="cfg-section">
      <div class="cfg-label">Google Calendar API Key</div>
      <input class="cfg-input" id="cfg-api-key" type="password" placeholder="AIza…" autocomplete="off" />
      <div class="cfg-note">Your key is saved locally in your browser. It needs the Google Calendar API enabled in Google Cloud Console.</div>
      <div id="cfg-key-status" style="font-size:11px;margin-top:5px;"></div>
    </div>

    <div class="cfg-actions">
      <button class="cfg-btn" onclick="closeConfig()">Cancel</button>
      <button class="cfg-btn primary" onclick="saveConfig()">Save &amp; Reload Calendar</button>
    </div>
  </div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   CLOCK & DISPLAY MODE
════════════════════════════════════════════════════════════════════════ */
function getMode(now) {
  const mins = now.getHours()*60 + now.getMinutes();
  if (mins >= 7*60 && mins < 20*60)     return 'light';
  if (mins >= 20*60 && mins < 22*60+30) return 'dark';
  return 'screensaver';
}
let _lastMode = null, _lastScheduledMode = null;
function checkMode() {
  const m = getMode(new Date());
  if (m === _lastScheduledMode) return;
  _lastScheduledMode = m; _lastMode = m;
  const html = document.documentElement, ss = document.getElementById('screensaver');
  if (m === 'screensaver') { html.classList.add('dark-mode'); ss.classList.add('active'); }
  else { ss.classList.remove('active'); m === 'dark' ? html.classList.add('dark-mode') : html.classList.remove('dark-mode'); }
}
function exitScreensaver() {
  document.getElementById('screensaver').classList.remove('active');
  setTimeout(() => { if (getMode(new Date()) === 'screensaver') document.getElementById('screensaver').classList.add('active'); }, 300000);
}
function openConfig() {
  const m = _lastMode || getMode(new Date());
  document.getElementById('override-light-btn').style.cssText = m==='light' ? 'background:var(--blue);color:#fff' : '';
  document.getElementById('override-dark-btn').style.cssText  = m==='dark'  ? 'background:var(--blue);color:#fff' : '';
  const saved = localStorage.getItem('gcal_api_key') || '';
  document.getElementById('cfg-api-key').value = saved;
  const status = document.getElementById('cfg-key-status');
  status.textContent = saved ? '✓ Key saved' : 'No key saved yet';
  status.style.color = saved ? 'var(--green)' : 'var(--muted)';
  document.getElementById('cfg-overlay').classList.add('open');
}
function closeConfig() { document.getElementById('cfg-overlay').classList.remove('open'); }
function saveConfig() {
  const key = document.getElementById('cfg-api-key').value.trim();
  if (key) {
    localStorage.setItem('gcal_api_key', key);
    _calApiKey = key;
  } else {
    localStorage.removeItem('gcal_api_key');
    _calApiKey = '';
  }
  closeConfig();
  initCalendar();
}
function overrideMode(mode) {
  _lastMode = null; _lastScheduledMode = null;
  const html = document.documentElement, ss = document.getElementById('screensaver');
  if (mode === 'screensaver') { html.classList.add('dark-mode'); ss.classList.add('active'); _lastMode = 'screensaver'; closeConfig(); }
  else if (mode === 'dark')   { ss.classList.remove('active'); html.classList.add('dark-mode'); _lastMode = 'dark'; }
  else                         { ss.classList.remove('active'); html.classList.remove('dark-mode'); _lastMode = 'light'; }
  document.getElementById('override-light-btn').style.cssText = mode==='light' ? 'background:var(--blue);color:#fff' : '';
  document.getElementById('override-dark-btn').style.cssText  = mode==='dark'  ? 'background:var(--blue);color:#fff' : '';
}
function tickClock() {
  const now = new Date(),
        DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
        MONS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  let h = now.getHours(), m = now.getMinutes(); const ap = h>=12?'PM':'AM'; h = h%12||12;
  const ts = `${h}:${String(m).padStart(2,'0')} ${ap}`;
  const ds = `${DAYS[now.getDay()]}, ${MONS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
  document.getElementById('clock').textContent    = ts;
  document.getElementById('datestr').textContent  = ds;
  document.getElementById('ss-clock').textContent = ts;
  document.getElementById('ss-date').textContent  = ds;
  checkMode();
}
setInterval(tickClock, 1000); tickClock();


/* ════════════════════════════════════════════════════════════════════════
   WEATHER
════════════════════════════════════════════════════════════════════════ */
const WX_LAT = 40.88, WX_LON = -73.91, WX_LABEL = 'Bronx, NY';
const WMO = {
  0:{l:'Clear',svg:'sun'},1:{l:'Mostly Clear',svg:'sun'},2:{l:'Partly Cloudy',svg:'partly'},
  3:{l:'Overcast',svg:'cloud'},45:{l:'Foggy',svg:'fog'},48:{l:'Icy Fog',svg:'fog'},
  51:{l:'Light Drizzle',svg:'drizzle'},53:{l:'Drizzle',svg:'drizzle'},55:{l:'Heavy Drizzle',svg:'drizzle'},
  61:{l:'Light Rain',svg:'rain'},63:{l:'Rain',svg:'rain'},65:{l:'Heavy Rain',svg:'rain'},
  71:{l:'Light Snow',svg:'snow'},73:{l:'Snow',svg:'snow'},75:{l:'Heavy Snow',svg:'snow'},
  77:{l:'Snow Grains',svg:'snow'},80:{l:'Light Showers',svg:'showers'},81:{l:'Showers',svg:'showers'},
  82:{l:'Heavy Showers',svg:'showers'},85:{l:'Snow Showers',svg:'snow'},86:{l:'Heavy Snow Showers',svg:'snow'},
  95:{l:'Thunderstorms',svg:'thunder'},96:{l:'Hail Storm',svg:'thunder'},99:{l:'Heavy Hail Storm',svg:'thunder'}
};
function wmo(c){return WMO[c]||{l:'Unknown',svg:'cloud'};}
function wxSVG(id,size=28){const s=size,icons={sun:`<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="6.5" fill="rgba(255,210,60,0.95)"/>${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180,x1=16+9*Math.cos(r),y1=16+9*Math.sin(r),x2=16+11.5*Math.cos(r),y2=16+11.5*Math.sin(r);return`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(255,210,60,0.85)" stroke-width="1.8" stroke-linecap="round"/>`;}).join('')}</svg>`,partly:`<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><circle cx="13" cy="13" r="5.5" fill="rgba(255,210,60,0.9)"/>${[0,60,120,180,240,300].map(a=>{const r=a*Math.PI/180,x1=13+8*Math.cos(r),y1=13+8*Math.sin(r),x2=13+10*Math.cos(r),y2=13+10*Math.sin(r);return`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(255,210,60,0.8)" stroke-width="1.5" stroke-linecap="round"/>`;}).join('')}<path d="M10 21 Q10 17 14 17 Q14 14 18 14 Q22 14 22 18 Q24 18 24 21 Z" fill="rgba(255,255,255,0.92)"/></svg>`,cloud:`<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><path d="M6 22 Q6 17 11 17 Q11 13 16 13 Q21 13 21 17 Q24 17 24 20 Q24 22 22 22 Z" fill="rgba(255,255,255,0.88)"/></svg>`,fog:`<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><path d="M5 14 Q10 12 16 14 Q22 16 27 14" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" stroke-linecap="round"/><path d="M7 18 Q12 16 18 18 Q23 20 26 18" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-linecap="round"/><path d="M5 22 Q11 20 17 22 Q22 24 27 22" stroke="rgba(255,255,255,0.35)" stroke-width="1.8" stroke-linecap="round"/></svg>`,drizzle:`<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><path d="M7 16 Q7 11 12 11 Q12 8 17 8 Q22 8 22 12 Q25 12 25 16 Q25 18 23 18 H9 Q7 18 7 16Z" fill="rgba(255,255,255,0.85)"/><line x1="13" y1="21" x2="11" y2="25" stroke="rgba(130,200,255,0.9)" stroke-width="1.5" stroke-linecap="round"/><line x1="18" y1="21" x2="16" y2="25" stroke="rgba(130,200,255,0.9)" stroke-width="1.5" stroke-linecap="round"/></svg>`,rain:`<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><path d="M6 15 Q6 10 11 10 Q11 7 16 7 Q21 7 21 11 Q24 11 24 15 Q24 17 22 17 H8 Q6 17 6 15Z" fill="rgba(255,255,255,0.82)"/><line x1="11" y1="21" x2="9" y2="26" stroke="rgba(130,200,255,0.95)" stroke-width="1.8" stroke-linecap="round"/><line x1="16" y1="21" x2="14" y2="26" stroke="rgba(130,200,255,0.95)" stroke-width="1.8" stroke-linecap="round"/><line x1="21" y1="21" x2="19" y2="26" stroke="rgba(130,200,255,0.95)" stroke-width="1.8" stroke-linecap="round"/></svg>`,snow:`<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><path d="M7 15 Q7 10 12 10 Q12 7 16 7 Q21 7 21 11 Q24 11 24 15 Q24 17 22 17 H9 Q7 17 7 15Z" fill="rgba(255,255,255,0.8)"/><text x="11" y="27" font-size="11" fill="rgba(200,230,255,0.95)" font-family="sans-serif" letter-spacing="3">&#10052;</text></svg>`,showers:`<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><circle cx="10" cy="11" r="4" fill="rgba(255,210,60,0.75)"/><path d="M13 16 Q13 13 17 13 Q17 10 21 10 Q25 10 25 14 Q27 14 27 17 Q27 19 25 19 H15 Q13 19 13 17Z" fill="rgba(255,255,255,0.82)"/><line x1="17" y1="22" x2="15" y2="27" stroke="rgba(130,200,255,0.9)" stroke-width="1.8" stroke-linecap="round"/><line x1="22" y1="22" x2="20" y2="27" stroke="rgba(130,200,255,0.9)" stroke-width="1.8" stroke-linecap="round"/></svg>`,thunder:`<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><path d="M5 15 Q5 10 10 10 Q10 7 15 7 Q20 7 20 11 Q23 11 23 15 Q23 17 21 17 H7 Q5 17 5 15Z" fill="rgba(255,255,255,0.82)"/><path d="M15 18 L12 24 L15 24 L13 30 L19 22 L16 22 Z" fill="rgba(255,220,50,0.95)"/></svg>`};return icons[id]||icons['cloud'];}

let _wxRotateTimer = null, _wxFV = 0;
function wxRotate(){const d=document.getElementById('wx-forecast-daily'),h=document.getElementById('wx-forecast-hourly'),d0=document.getElementById('wx-dot-0'),d1=document.getElementById('wx-dot-1');if(!d||!h)return;_wxFV=1-_wxFV;if(_wxFV===0){d.style.opacity='1';d.style.transform='translateY(0)';h.style.opacity='0';h.style.transform='translateY(6px)';if(d0){d0.style.background='rgba(255,255,255,0.8)';d0.style.width='14px';}if(d1){d1.style.background='rgba(255,255,255,0.3)';d1.style.width='6px';}}else{d.style.opacity='0';d.style.transform='translateY(-6px)';h.style.opacity='1';h.style.transform='translateY(0)';if(d0){d0.style.background='rgba(255,255,255,0.3)';d0.style.width='6px';}if(d1){d1.style.background='rgba(255,255,255,0.8)';d1.style.width='14px';}}}
function wxStartRot(){if(_wxRotateTimer)clearInterval(_wxRotateTimer);_wxRotateTimer=setInterval(wxRotate,15000);}

async function fetchWeather(){
  const inner = document.getElementById('wx-inner');
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${WX_LAT}&longitude=${WX_LON}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=temperature_2m,weather_code,precipitation_probability&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York&forecast_days=4`;
    const data = await(await fetch(url)).json();
    const cur=data.current,daily=data.daily,hourly=data.hourly;
    const tempNow=Math.round(cur.temperature_2m),feels=Math.round(cur.apparent_temperature),hum=Math.round(cur.relative_humidity_2m),wind=Math.round(cur.wind_speed_10m),wdir=windDir(cur.wind_direction_10m),ci=wmo(cur.weather_code);
    const DS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const fdays=[];
    for(let i=1;i<=3;i++){if(!daily.time[i])break;const d=new Date(daily.time[i]+'T12:00:00');fdays.push({name:DS[d.getDay()],hi:Math.round(daily.temperature_2m_max[i]),lo:Math.round(daily.temperature_2m_min[i]),code:daily.weather_code[i],precip:daily.precipitation_probability_max[i]||0});}
    const now=new Date(),todStr=now.toISOString().slice(0,10),curH=now.getHours(),hslots=[];
    hourly.time.forEach((t,i)=>{if(!t.startsWith(todStr))return;const h=parseInt(t.slice(11,13));if(h<curH||(h-curH)%2!==0)return;let lbl;if(h===0||h===24)lbl='12am';else if(h<12)lbl=`${h}am`;else if(h===12)lbl='12pm';else lbl=`${h-12}pm`;hslots.push({lbl,temp:Math.round(hourly.temperature_2m[i]),code:hourly.weather_code[i],precip:hourly.precipitation_probability[i]||0});});
    const upd=`${String(now.getHours()%12||12)}:${String(now.getMinutes()).padStart(2,'0')} ${now.getHours()>=12?'PM':'AM'}`;
    const dHTML=fdays.map(d=>{const di=wmo(d.code);return`<div class="wx-day"><div class="wx-day-name">${d.name}</div><div class="wx-day-icon">${wxSVG(di.svg,22)}</div>${d.precip>20?`<div class="wx-precip"><svg width="8" height="8" viewBox="0 0 10 10"><path d="M5 1 Q6.5 4 6.5 6 A1.5 1.5 0 0 1 3.5 6 Q3.5 4 5 1Z" fill="rgba(130,200,255,0.9)"/></svg>${d.precip}%</div>`:''}<div class="wx-day-hi">${d.hi}&#176;</div><div class="wx-day-lo">${d.lo}&#176;</div></div>`;}).join('');
    const hHTML=hslots.map(h=>{const hi=wmo(h.code);return`<div class="wx-day"><div class="wx-day-name">${h.lbl}</div><div class="wx-day-icon">${wxSVG(hi.svg,22)}</div>${h.precip>20?`<div class="wx-precip"><svg width="8" height="8" viewBox="0 0 10 10"><path d="M5 1 Q6.5 4 6.5 6 A1.5 1.5 0 0 1 3.5 6 Q3.5 4 5 1Z" fill="rgba(130,200,255,0.9)"/></svg>${h.precip}%</div>`:''}<div class="wx-day-hi">${h.temp}&#176;</div></div>`;}).join('');
    _wxFV=0;
    inner.innerHTML=`<div class="wx-location-row"><div class="wx-location"><svg width="9" height="9" viewBox="0 0 12 12" fill="none"><path d="M6 1a3.5 3.5 0 0 1 3.5 3.5C9.5 7.5 6 11 6 11S2.5 7.5 2.5 4.5A3.5 3.5 0 0 1 6 1z" fill="rgba(255,255,255,0.6)"/><circle cx="6" cy="4.5" r="1.2" fill="rgba(30,60,110,0.6)"/></svg>${WX_LABEL}</div><div class="wx-updated">Updated ${upd}</div></div><div class="wx-main-row"><div class="wx-temp-block"><div class="wx-temp">${tempNow}<sup>&#176;F</sup></div><div class="wx-condition">${ci.l}</div><div class="wx-feels">Feels like ${feels}&#176;</div></div><div class="wx-icon-wrap">${wxSVG(ci.svg,52)}</div></div><div class="wx-details-row"><div class="wx-detail-pill"><svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M6 2 Q7.5 5 7.5 7 A1.5 1.5 0 0 1 4.5 7 Q4.5 5 6 2Z" fill="rgba(130,200,255,0.9)"/></svg>${hum}% Humidity</div><div class="wx-detail-pill"><svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6 L10 6 M7 3 L10 6 L7 9" stroke="rgba(255,255,255,0.8)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>${wind} mph ${wdir}</div></div><div class="wx-divider-row"><div class="wx-divider" style="flex:1"></div><div style="display:flex;align-items:center;gap:4px;padding:0 6px;flex-shrink:0"><div id="wx-dot-0" style="height:6px;width:14px;border-radius:3px;background:rgba(255,255,255,0.8);transition:all 0.4s ease"></div><div id="wx-dot-1" style="height:6px;width:6px;border-radius:3px;background:rgba(255,255,255,0.3);transition:all 0.4s ease"></div></div><div class="wx-divider" style="flex:1"></div></div><div style="position:relative;flex:1;min-height:0;"><div id="wx-forecast-daily" class="wx-forecast" style="position:absolute;inset:0;transition:opacity 0.5s ease,transform 0.5s ease;opacity:1;transform:translateY(0)">${dHTML}</div><div id="wx-forecast-hourly" class="wx-forecast" style="position:absolute;inset:0;transition:opacity 0.5s ease,transform 0.5s ease;opacity:0;transform:translateY(6px);overflow-x:auto;flex-wrap:nowrap;">${hHTML||'<div style="color:rgba(255,255,255,0.4);font-size:0.8vw;margin:auto">No more hours today</div>'}</div></div>`;
    wxStartRot();
  }catch(e){
    if(_wxRotateTimer){clearInterval(_wxRotateTimer);_wxRotateTimer=null;}

async function nflGameWeather(city,state,dateISO){

      const hit=(gr.results||[]).find(r=>r.country_code==='US')||(gr.results||[])[0];

function nflLiveCard(comp){
  const st=comp.status||{},period=st.period||0,clock=st.displayClock||'';
  const q=period<=4?`Q${period}`:(period===5?'OT':`OT${period-4}`);

  const possAbbr=awayBall?(away.team.abbreviation):homeBall?(home.team.abbreviation):'';

async function nflPreCard(ev,comp){

function nflByeCard(){

async function buildNFLSlide(){
  // Scoreboard reflects the current week and is the only feed with live possession/down/clock. Ignore preseason (season.type 1).
  let sb=null;try{sb=await(await fetch(`${ESPN_NFL}/scoreboard`)).json();}catch(e){}
  const sbNE=(sb&&sb.events||[]).find(e=>e.season&&e.season.type!==1&&(e.competitions[0].competitors||[]).some(c=>c.team&&c.team.abbreviation==='NE'));
  const sbState=sbNE&&sbNE.competitions[0].status&&sbNE.competitions[0].status.type&&sbNE.competitions[0].status.type.state;
  if(sbNE&&sbState==='in')return nflLiveCard(sbNE.competitions[0]);
  // Regular season + playoffs only (no preseason); the default feed omits most of these.
  const byId=new Map();
  await Promise.all([2,3].map(async t=>{try{const d=await(await fetch(`${ESPN_NFL}/teams/ne/schedule?seasontype=${t}`)).json();(d.events||[]).forEach(ev=>{if(ev.competitions&&ev.competitions[0]&&!byId.has(ev.id))byId.set(ev.id,{ev,c:ev.competitions[0]});});}catch(e){}}));
  if(sbNE&&!byId.has(sbNE.id))byId.set(sbNE.id,{ev:sbNE,c:sbNE.competitions[0]}); // covers a current game not in the schedule feeds
  const cands=[...byId.values()].map(o=>({...o,state:o.c.status&&o.c.status.type&&o.c.status.type.state,ts:nflETNaive(o.ev.date)}));
  // Game in the current NFL week (Wed 00:00 ET -> Tue 23:59 ET). Result stays until Tue; flips to next game at 12am Wed.
  const {start,end}=nflWeekWindow();
  const g=cands.filter(o=>o.ts>=start&&o.ts<end).sort((a,b)=>a.ts-b.ts);
  const game=g.find(o=>o.state==='in')||g[0];
  if(game){
    if(game.state==='in')return nflLiveCard(game.c);            // live: score, quarter, clock, possession
    if(game.state==='post')return nflPostCard(game.ev,game.c);  // finished earlier this week: keep the result up
    return await nflPreCard(game.ev,game.c);                    // scheduled this week: date/time/location/network/weather
  }
  // No game in the current week.
  const upcoming=cands.filter(o=>o.state==='pre').sort((a,b)=>a.ts-b.ts)[0];
  const played=cands.some(o=>o.state==='post');
  if(upcoming&&!played)return await nflPreCard(upcoming.ev,upcoming.c); // season not started yet: show the opener now
  if(upcoming)return nflByeCard();                                      // mid-season bye
  const lastDone=cands.filter(o=>o.state==='post').sort((a,b)=>b.ts-a.ts)[0];
  return lastDone?nflPostCard(lastDone.ev,lastDone.c):nflByeCard();     // season over: keep the last result up
}

function showSlide(idx){carouselIndex=((idx%TEAM_CONFIGS.length)+TEAM_CONFIGS.length)%TEAM_CONFIGS.length;renderDots();const wrap=document.getElementById('scores-wrap');wrap.innerHTML='';if(carouselCards[carouselIndex])wrap.appendChild(carouselCards[carouselIndex]);else wrap.innerHTML='<div class="score-loading"><span class="spinner"></span></div>';}
function goToSlide(idx){showSlide(idx);resetAutoAdvance();}
function carouselNext(){goToSlide(carouselIndex+1);}
function carouselPrev(){goToSlide(carouselIndex-1);}
function resetAutoAdvance(){if(carouselAutoTimer)clearInterval(carouselAutoTimer);carouselAutoTimer=setInterval(()=>showSlide(carouselIndex+1),8000);}
async function fetchScores(){
  const etStr=new Date().toLocaleString('en-US',{timeZone:'America/New_York'}),etNow=new Date(etStr);
  // Keep last night's game up until 11am ET the next day: before 11am, use yesterday's date.
  if(etNow.getHours()<11)etNow.setDate(etNow.getDate()-1);
  const ymd=`${etNow.getFullYear()}-${String(etNow.getMonth()+1).padStart(2,'0')}-${String(etNow.getDate()).padStart(2,'0')}`;
  await Promise.all(TEAM_CONFIGS.map(async(cfg,idx)=>{try{if(cfg.kind==='nfl'){carouselCards[idx]=await buildNFLSlide();return;}const url=`${MLB_BASE}/api/v1/schedule?teamId=${cfg.teamId}&sportId=1&date=${ymd}&hydrate=probablePitcher(stats),linescore,decisions,seriesStatus,team`,res=await fetch(url),data=await res.json(),games=data.dates?.[0]?.games||[],game=games.find(g=>g.status?.detailedState!=='Postponed')||games[0]||null;carouselCards[idx]=game?await buildMLBCard(game):buildEmptyCard(cfg.label.split(' · ')[1]||cfg.label);}catch(e){const el=document.createElement('div');el.className='score-loading';el.textContent='Unable to load';carouselCards[idx]=el;}}));
  showSlide(carouselIndex);
}


/* ════════════════════════════════════════════════════════════════════════
   NATIVE GOOGLE CALENDAR
════════════════════════════════════════════════════════════════════════ */
const CAL_TZ      = 'America/New_York';
const HOUR_HEIGHT = 48;   // px — must match CSS .cal-hour-label height
const MIN_EVT_H   = 18;   // minimum event block height px
const CAL_REFRESH = 5 * 60 * 1000;   // re-fetch every 5 min
const CAL_TICK    = 60 * 1000;       // scroll / now-line tick every 1 min

const CALENDARS = [
  { id:'3lmel4i9s4986sorpekg2st8ek@group.calendar.google.com',                                              color:'#8e24aa' },
  { id:'family06071768983274341555@group.calendar.google.com',                                              color:'#7986cb' },
  { id:'gqvubh330psg63ohfaeqdelbs04llacr@import.calendar.google.com',                                      color:'#3f51b5' },
  { id:'en.usa#holiday@group.v.calendar.google.com',                                                        color:'#7cb342' },
  { id:'c_faf9900f7afdcfe6667145cc126e5f9bd56f96dce866e751432fea1120350368@group.calendar.google.com',     color:'#ad1457' },
];

let _calApiKey   = localStorage.getItem('gcal_api_key') || '';
let _calEvents   = [];
let _calDays     = [];
let _calRefresh  = null;
let _calTick     = null;
let _calFirstScroll = true;

const MONS3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function toNY(date) {
  const s = date.toLocaleString('en-US',{timeZone:CAL_TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  const [datePart, timePart] = s.split(', ');
  const [mo,d,y] = datePart.split('/').map(Number);
  let [h,min]    = timePart.split(':').map(Number);
  if (h === 24) h = 0;
  return {y,mo,d,h,min};
}

function buildCalDays() {
  const now = new Date();
  const todNY = toNY(now);
  const days = [];
  for (let offset = -1; offset <= 5; offset++) {
    const dt = new Date(now);
    dt.setDate(dt.getDate() + offset);
    const info = toNY(dt);
    days.push({
      year:info.y, month:info.mo, day:info.d,
      dow: DAYS3[dt.getDay()],
      label:`${MONS3[info.mo-1]} ${info.d}`,
      isToday:(info.y===todNY.y && info.mo===todNY.mo && info.d===todNY.d),
    });
  }
  return days;
}

function fmtTime12(date) {
  const {h,min} = toNY(date);
  const ap = h>=12?'p':'a';
  const h12 = h%12||12;
  return min===0 ? `${h12}${ap}` : `${h12}:${String(min).padStart(2,'0')}${ap}`;
}

function minuteOfDayNY(date) {
  const {h,min} = toNY(date);
  return h*60+min;
}

function isSameDayNY(date, dayObj) {
  const e = toNY(date);
  return e.y===dayObj.year && e.mo===dayObj.month && e.d===dayObj.day;
}

function hexToRgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

async function fetchCalendarData() {
  if (!_calApiKey) return;
  _calDays = buildCalDays();
  const first = _calDays[0], last = _calDays[6];
  // Use noon UTC offsets to safely cover day boundaries
  const timeMin = new Date(first.year, first.month-1, first.day, 0, 0, 0).toISOString();
  const timeMax = new Date(last.year,  last.month-1,  last.day,  23,59,59).toISOString();
  const BASE = 'https://www.googleapis.com/calendar/v3/calendars';

  const results = await Promise.allSettled(
    CALENDARS.map(async cal => {
      const encId = encodeURIComponent(cal.id);
      const url   = `${BASE}/${encId}/events?key=${_calApiKey}` +
        `&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}` +
        `&singleEvents=true&orderBy=startTime&maxResults=250&timeZone=${encodeURIComponent(CAL_TZ)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status === 403 || res.status === 401 ? 'auth' : `HTTP ${res.status}`);
      const data = await res.json();
      return (data.items||[]).map(ev => ({...ev, _color: cal.color}));
    })
  );

  // Check auth failure
  const authFail = results.find(r => r.status==='rejected' && r.reason?.message==='auth');
  if (authFail) {
    localStorage.removeItem('gcal_api_key');
    _calApiKey = '';
    document.getElementById('cal-loading').style.display = 'none';
    // Show error state inside calendar
    const grid = document.getElementById('cal-grid');
    if (grid) grid.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:0.75vw;">Calendar API key invalid or expired.<br>Open Setup (⚙) to re-enter your key.</div>';
    return;
  }

  _calEvents = results.flatMap(r => r.status==='fulfilled' ? r.value : []);
  renderCalendar();
}

function renderCalHeader() {
  const header = document.getElementById('cal-header');
  while (header.children.length > 1) header.removeChild(header.lastChild);
  _calDays.forEach(day => {
    const col = document.createElement('div');
    col.className = 'cal-day-header' + (day.isToday?' today':'');
    col.innerHTML = `<div class="cal-day-header-dow">${day.dow}</div><div class="cal-day-header-date">${day.label}</div>`;
    header.appendChild(col);
  });
}

function renderCalAllDay() {
  const strip = document.getElementById('cal-allday');
  while (strip.children.length > 1) strip.removeChild(strip.lastChild);
  _calDays.forEach(day => {
    const col = document.createElement('div');
    col.className = 'cal-allday-col' + (day.isToday?' today':'');
    const adEvts = _calEvents.filter(ev => {
      if (!ev.start?.date || ev.start?.dateTime) return false;
      const [sy,sm,sd] = ev.start.date.split('-').map(Number);
      const [ey,em,ed] = ev.end.date.split('-').map(Number);
      const s = new Date(sy,sm-1,sd), e = new Date(ey,em-1,ed);
      const d = new Date(day.year,day.month-1,day.day);
      return d>=s && d<e;
    });
    adEvts.slice(0,2).forEach(ev => {
      const pill = document.createElement('div');
      pill.className = 'cal-allday-event';
      pill.style.background = ev._color;
      pill.textContent = ev.summary || '(no title)';
      col.appendChild(pill);
    });
    if (adEvts.length > 2) {
      const more = document.createElement('div');
      more.className = 'cal-allday-more';
      more.textContent = `+${adEvts.length-2} more`;
      col.appendChild(more);
    }
    strip.appendChild(col);
  });
}

function renderCalGrid() {
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const HOURS = Array.from({length:24},(_,i)=>i);

  // Hour labels column
  HOURS.forEach(h => {
    const label = document.createElement('div');
    label.className = 'cal-hour-label';
    label.style.gridColumn = '1';
    if (h > 0) {
      const ap = h>=12?'p':'a', h12 = h%12||12;
      label.textContent = `${h12}${ap}`;
    }
    grid.appendChild(label);
  });

  // Day columns
  _calDays.forEach((day, dayIdx) => {
    const col = document.createElement('div');
    col.className = 'cal-day-col' + (day.isToday?' today':'');
    col.style.gridColumn = String(dayIdx+2);
    col.style.gridRow    = `1 / ${HOURS.length+1}`;

    // Grid lines
    HOURS.forEach(() => {
      const cell = document.createElement('div');
      cell.className = 'cal-hour-cell';
      col.appendChild(cell);
    });

    // Timed events
    const timedEvts = _calEvents.filter(ev => {
      if (!ev.start?.dateTime) return false;
      return isSameDayNY(new Date(ev.start.dateTime), day);
    }).sort((a,b) => new Date(a.start.dateTime) - new Date(b.start.dateTime));

    timedEvts.forEach(ev => {
      const startDt  = new Date(ev.start.dateTime);
      const endDt    = new Date(ev.end.dateTime);
      const startMin = minuteOfDayNY(startDt);
      const endMin   = minuteOfDayNY(endDt);
      const dur      = Math.max(endMin - startMin, 15);
      const top      = (startMin / 60) * HOUR_HEIGHT;
      const height   = Math.max((dur / 60) * HOUR_HEIGHT, MIN_EVT_H);

      const block = document.createElement('div');
      block.className = 'cal-event';
      block.style.top         = `${top}px`;
      block.style.height      = `${height}px`;
      block.style.background  = hexToRgba(ev._color, 0.85);
      block.style.borderLeftColor = ev._color;
      block.innerHTML = `<div class="cal-event-inner"><span class="cal-event-time">${fmtTime12(startDt)}&thinsp;·&thinsp;</span><span class="cal-event-title">${ev.summary||'(no title)'}</span></div>`;
      col.appendChild(block);
    });

    grid.appendChild(col);
  });

  // Now indicator
  const todayIdx = _calDays.findIndex(d => d.isToday);
  if (todayIdx >= 0) {
    const wrap = document.createElement('div');
    wrap.id = 'now-line-wrap';
    wrap.style.cssText = `position:absolute;top:0;bottom:0;left:calc(42px + (100% - 42px) / 7 * ${todayIdx});width:calc((100% - 42px) / 7);pointer-events:none;z-index:5;`;
    const line = document.createElement('div');
    line.id = 'now-line';
    line.innerHTML = '<div id="now-dot"></div>';
    wrap.appendChild(line);
    grid.appendChild(wrap);
  }
}

function positionNowLine() {
  const line = document.getElementById('now-line');
  if (!line) return;
  const {h,min} = toNY(new Date());
  line.style.top = `${((h*60+min)/60)*HOUR_HEIGHT}px`;
}

function calScrollToNow(smooth) {
  const scroll = document.getElementById('cal-scroll');
  if (!scroll) return;
  const {h,min} = toNY(new Date());
  const px = ((h*60+min)/60)*HOUR_HEIGHT;
  // Never scroll above 8am; follow current time if later in the day
  const eightAM = (8 * 60 / 60) * HOUR_HEIGHT;
  const target = Math.max(eightAM, px - scroll.clientHeight * 0.38);
  if (_calFirstScroll) {
    scroll.scrollTop = target;
    _calFirstScroll = false;
  } else if (smooth) {
    scroll.scrollTo({top:target, behavior:'smooth'});
  }
}

function renderCalendar() {
  renderCalHeader();
  renderCalAllDay();
  renderCalGrid();
  positionNowLine();
  calScrollToNow(false);
}

async function initCalendar() {
  if (!_calApiKey) {
    // Show a subtle prompt inside the calendar area
    const grid = document.getElementById('cal-grid');
    if (grid) grid.innerHTML = `<div style="padding:32px;text-align:center;color:var(--muted);font-size:0.8vw;line-height:2;">No Google Calendar API key set.<br><span style="font-size:0.7vw;">Open <strong>⚙ Setup</strong> to enter your key.</span></div>`;
    // Still render the shell so headers show
    _calDays = buildCalDays();
    renderCalHeader();
    renderCalAllDay();
    return;
  }

  document.getElementById('cal-loading').style.display = 'flex';
  _calFirstScroll = true;
  await fetchCalendarData();
  document.getElementById('cal-loading').style.display = 'none';

  if (_calRefresh) clearInterval(_calRefresh);
  _calRefresh = setInterval(async () => {
    _calDays = buildCalDays();
    await fetchCalendarData();
  }, CAL_REFRESH);

  if (_calTick) clearInterval(_calTick);
  _calTick = setInterval(() => {
    positionNowLine();
    calScrollToNow(true);
  }, CAL_TICK);

  // Also tick now-line every 30s for visual accuracy
  setInterval(positionNowLine, 30*1000);
}

async function refreshAll() {
  const oneTeam = TEAM_CONFIGS.length === 1;
  document.getElementById('carousel-dots').style.display = oneTeam ? 'none' : 'flex';
  document.querySelectorAll('[onclick="carouselPrev()"], [onclick="carouselNext()"]')
    .forEach(btn => btn.style.display = oneTeam ? 'none' : 'flex');
  await fetchWeather();
}

resetAutoAdvance();
fetchScores();
refreshAll();
initCalendar();

setInterval(refreshAll,  15*60*1000);  // weather every 15 min
setInterval(fetchScores,    30*1000);  // scores every 30 sec
</script>
